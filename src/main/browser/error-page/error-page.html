<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}}</title>
    <style>
      /* Self-contained styles — this document is injected wholesale via
         executeJavaScript so it can't @import the renderer stylesheet.
         The custom properties below are literal mirrors of the global
         design tokens (DESIGN.md §3). */
      :root {
        --n-page: #ffffff;
        --n-card: #ffffff;
        --n-grouped: #f5f5f7;
        --n-well: #f2f2f4;
        --n-separator: #e5e5ea;
        --n-fill: rgba(0, 0, 0, 0.05);
        --n-fill-2: rgba(0, 0, 0, 0.07);
        --n-control-edge: #8e8e93;
        --n-text-1: #1d1d1f;
        --n-text-2: #424245;
        --n-text-3: #6e6e73;
        --n-on-accent: #ffffff;
        --n-accent: #0066d6;
        --n-accent-hover: #0058b9;
        --n-focus-ring: 0 0 0 3px rgba(0, 102, 214, 0.28);
        --n-r-control: 4px;
        --n-r-panel: 6px;
        --dur-fast: 120ms;
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }

      /* Same contrast step-up as global.css (DESIGN.md §3.4). */
      @media (prefers-contrast: more) {
        :root {
          --n-separator: #8e8e93;
          --n-control-edge: #6e6e73;
          --n-text-3: #424245;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: var(--n-page);
        color: var(--n-text-1);
        font-family: var(--font-sans);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* An 880 px content column; the side padding is added to the max-width
         so it only shows as a gutter on narrow windows. */
      .error-wrapper {
        max-width: calc(880px + 2 * 24px);
        margin: 0 auto;
        padding: 72px 24px 80px;
      }

      /* Masthead */
      .error-head {
        margin-bottom: 28px;
      }

      .error-title {
        font-size: 28px;
        line-height: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--n-text-1);
        margin: 0;
      }

      /* Body: message column + optional side rail. The rail wraps below the
         message rather than squeezing it under 320 px on narrow windows. */
      .error-body {
        display: flex;
        flex-wrap: wrap;
        gap: 32px 40px;
        align-items: flex-start;
      }

      .error-body.no-side {
        display: block;
      }

      /* Main message column */
      .error-main {
        flex: 1 1 320px;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* Icon well */
      .error-glyph {
        width: 52px;
        height: 52px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: var(--n-r-control);
        background: var(--n-well);
        color: var(--n-text-2);
      }

      .error-glyph svg {
        width: 24px;
        height: 24px;
        display: block;
      }

      /* Mono error-code line */
      .error-eyebrow {
        margin-top: 18px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--n-text-3);
        font-weight: 400;
      }

      /* The heading and text carry the hostname, which can be one unbroken
         string: let it break rather than run past the column. */
      .error-heading {
        margin: 6px 0 0;
        font-size: 22px;
        line-height: 28px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--n-text-1);
        overflow-wrap: anywhere;
      }

      .error-text {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 20px;
        color: var(--n-text-2);
        overflow-wrap: anywhere;
      }

      .error-text .host {
        font-weight: 600;
        color: var(--n-text-1);
      }

      /* Mono net-error-code chip */
      .error-code {
        align-self: flex-start;
        margin-top: 14px;
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--n-text-2);
        background: var(--n-fill);
        border-radius: var(--n-r-control);
        overflow-wrap: anywhere;
      }

      /* Actions */
      .error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      /* Mirrors global.css .btn / .btn-primary / .btn-secondary. */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 14px;
        height: 32px;
        border-radius: var(--n-r-control);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        border: 0;
        flex: none;
        font-family: var(--font-sans);
        transition:
          background-color var(--dur-fast),
          box-shadow var(--dur-fast);
      }

      .btn.primary {
        background: var(--n-accent);
        color: var(--n-on-accent);
      }

      .btn.primary:hover {
        background: var(--n-accent-hover);
      }

      .btn.secondary {
        background: var(--n-fill);
        color: var(--n-text-1);
      }

      .btn.secondary:hover {
        background: var(--n-fill-2);
      }

      .btn svg {
        width: 14px;
        height: 14px;
        flex: none;
      }

      /* Keyboard focus only: a soft accent halo, never an outline. */
      :focus-visible {
        outline: none;
        box-shadow: var(--n-focus-ring);
      }

      /* Side rail — "Try this" panel. Once wrapped, it narrows with windows
         slimmer than the panel instead of scrolling sideways. */
      .error-side {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 100%;
      }

      /* 320 px of content inside 18 px side padding. */
      .panel {
        width: 356px;
        max-width: 100%;
        flex: none;
        border-radius: var(--n-r-panel);
        background: var(--n-grouped);
        overflow: hidden;
      }

      .panel-head {
        padding: 16px 18px 0;
      }

      .panel-head .panel-title {
        font-size: 13px;
        line-height: 16px;
        font-weight: 600;
        color: var(--n-text-1);
      }

      .panel-head .panel-sub {
        font-size: 12px;
        line-height: 15px;
        color: var(--n-text-3);
        margin-top: 2px;
      }

      .check-list {
        list-style: none;
        margin: 0;
        padding: 10px 18px 6px;
        counter-reset: check;
      }

      /* Every step, the first included, has a divider above it. */
      .check-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 0;
        border-top: 1px solid var(--n-separator);
        counter-increment: check;
      }

      .check-dot {
        width: 20px;
        height: 20px;
        flex: none;
        border-radius: 50%;
        background: var(--n-card);
        box-shadow: inset 0 0 0 1px var(--n-control-edge);
        color: var(--n-text-2);
        font-size: 11px;
        font-weight: 600;
        display: grid;
        place-items: center;
      }

      .check-dot::before {
        content: counter(check);
      }

      .check-row > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .check-title {
        font-size: 13px;
        line-height: 16px;
        font-weight: 500;
        color: var(--n-text-1);
      }

      .check-help {
        font-size: 12px;
        line-height: 15px;
        color: var(--n-text-3);
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <div class="error-wrapper">
        <div class="error-head">
          <h1 class="error-title">{{TITLE}}</h1>
        </div>

        <div class="error-body {{BODY_CLASS}}">
          <div class="error-main">
            <span class="error-glyph">{{ICON}}</span>
            <div class="error-eyebrow">{{EYEBROW}}</div>
            <h2 class="error-heading">{{HEADING}}</h2>
            <p class="error-text">{{MESSAGE}}</p>
            <span class="error-code">{{ERROR_CODE}}</span>
            <div class="error-actions">
              <button class="btn primary" onclick="location.reload()">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="23 4 23 10 17 10" />
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                Reload
              </button>
              <button class="btn secondary" onclick="history.back()">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="15 18 9 12 15 6" />
                </svg>
                Go back
              </button>
            </div>
          </div>

          {{SIDE_PANEL}}
        </div>
      </div>
    </div>
  </body>
</html>
