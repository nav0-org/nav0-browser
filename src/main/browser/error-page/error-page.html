<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}}</title>
    <style>
      /* Self-contained styles — this document is injected wholesale via
         executeJavaScript so it can't @import the renderer stylesheet.
         Literal values mirror the Nav0 redesign design tokens. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #ffffff;
        color: #424245;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      .error-wrapper {
        max-width: 880px;
        margin: 0 auto;
        padding: 72px 24px 80px;
      }

      /* Masthead */
      .error-head {
        margin-bottom: 28px;
      }

      .error-title {
        font-size: 28px;
        line-height: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #1d1d1f;
        margin: 0;
      }

      /* Body: main panel + optional side rail */
      .error-body {
        display: flex;
        gap: 40px;
        align-items: flex-start;
      }

      .error-body.no-side {
        display: block;
      }

      /* Main message column */
      .error-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* Icon well */
      .error-glyph {
        width: 52px;
        height: 52px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #f2f2f4;
        color: #424245;
      }

      .error-glyph svg {
        width: 24px;
        height: 24px;
        display: block;
      }

      /* Mono error-code line */
      .error-eyebrow {
        margin-top: 18px;
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: #6e6e73;
        font-weight: 400;
      }

      .error-heading {
        margin: 6px 0 0;
        font-size: 22px;
        line-height: 28px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: #1d1d1f;
      }

      .error-text {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 20px;
        color: #424245;
        max-width: 600px;
      }

      .error-text .host {
        font-weight: 600;
        color: #1d1d1f;
      }

      /* Mono net-error-code chip */
      .error-code {
        align-self: flex-start;
        margin-top: 14px;
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        color: #6e6e73;
        background: rgba(0, 0, 0, 0.05);
        border-radius: 4px;
      }

      /* Actions */
      .error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
        height: 32px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 0;
        flex: none;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition:
          background 120ms,
          color 120ms;
      }

      .btn.primary {
        background: #0066d6;
        color: #ffffff;
      }

      .btn.primary:hover {
        background: #0058b9;
      }

      .btn.secondary {
        background: rgba(0, 0, 0, 0.05);
        color: #1d1d1f;
      }

      .btn.secondary:hover {
        background: rgba(0, 0, 0, 0.09);
      }

      .btn svg {
        width: 14px;
        height: 14px;
        flex: none;
      }

      /* Side rail — "Try this" panel */
      .error-side {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel {
        width: 320px;
        flex: none;
        border-radius: 6px;
        background: #f5f5f7;
        overflow: hidden;
      }

      .panel-head {
        padding: 16px 18px 0;
      }

      .panel-head .panel-title {
        font-size: 13px;
        font-weight: 600;
        color: #1d1d1f;
      }

      .panel-head .panel-sub {
        font-size: 12px;
        color: #6e6e73;
        margin-top: 2px;
      }

      .check-list {
        list-style: none;
        margin: 0;
        padding: 10px 18px 6px;
        counter-reset: check;
      }

      .check-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 0;
        border-top: 1px solid #e5e5ea;
        counter-increment: check;
      }

      .check-row:first-child {
        border-top: 0;
      }

      .check-dot {
        width: 20px;
        height: 20px;
        flex: none;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: inset 0 0 0 1px #8e8e93;
        color: #424245;
        font-size: 11px;
        font-weight: 600;
        display: grid;
        place-items: center;
      }

      .check-dot::before {
        content: counter(check);
      }

      .check-row > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .check-title {
        font-size: 13px;
        font-weight: 600;
        color: #1d1d1f;
      }

      .check-help {
        font-size: 12px;
        color: #6e6e73;
        line-height: 1.4;
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <div class="error-wrapper">
        <div class="error-head">
          <h1 class="error-title">{{TITLE}}</h1>
        </div>

        <div class="error-body {{BODY_CLASS}}">
          <div class="error-main">
            <span class="error-glyph">{{ICON}}</span>
            <div class="error-eyebrow">{{EYEBROW}}</div>
            <h2 class="error-heading">{{HEADING}}</h2>
            <p class="error-text">{{MESSAGE}}</p>
            <span class="error-code">{{ERROR_CODE}}</span>
            <div class="error-actions">
              <button class="btn primary" onclick="location.reload()">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="23 4 23 10 17 10" />
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                Reload
              </button>
              <button class="btn secondary" onclick="history.back()">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="15 18 9 12 15 6" />
                </svg>
                Go back
              </button>
            </div>
          </div>

          {{SIDE_PANEL}}
        </div>
      </div>
    </div>
  </body>
</html>
