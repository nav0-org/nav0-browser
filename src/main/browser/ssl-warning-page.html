<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      /* Self-contained styles — this page is served as a data: URL so it
         can't load the renderer stylesheet. The custom properties below are
         literal mirrors of the global design tokens (DESIGN.md §3). */
      :root {
        --n-page: #ffffff;
        --n-grouped: #f5f5f7;
        --n-separator: #e5e5ea;
        --n-fill: rgba(0, 0, 0, 0.05);
        --n-fill-2: rgba(0, 0, 0, 0.07);
        --n-control-edge: #8e8e93;
        --n-text-1: #1d1d1f;
        --n-text-2: #424245;
        --n-text-3: #6e6e73;
        --n-on-accent: #ffffff;
        --n-accent: #0066d6;
        --n-accent-hover: #0058b9;
        --n-danger: #d70015;
        --n-danger-soft: rgba(215, 0, 21, 0.08);
        --n-focus-ring: 0 0 0 3px rgba(0, 102, 214, 0.28);
        --n-r-control: 4px;
        --n-r-panel: 6px;
        --dur-fast: 120ms;
        --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Same contrast step-up as global.css (DESIGN.md §3.4). */
      @media (prefers-contrast: more) {
        :root {
          --n-separator: #8e8e93;
          --n-control-edge: #6e6e73;
          --n-text-3: #424245;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: var(--n-page);
        color: var(--n-text-1);
        font-family: var(--font-sans);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* An 880 px content column; the side padding is added to the max-width
         so it only shows as a gutter on narrow windows. */
      .ssl-wrapper {
        max-width: calc(880px + 2 * 24px);
        margin: 0 auto;
        padding: 72px 24px 80px;
      }

      .ssl-head {
        margin-bottom: 28px;
      }

      .ssl-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--n-danger);
        margin: 0;
        line-height: 34px;
      }

      .ssl-main {
        display: flex;
        flex-direction: column;
      }

      .ssl-glyph {
        width: 52px;
        height: 52px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: var(--n-r-control);
        background: var(--n-danger-soft);
        color: var(--n-danger);
      }

      .ssl-glyph svg {
        width: 24px;
        height: 24px;
        display: block;
      }

      .ssl-eyebrow {
        margin-top: 18px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--n-text-3);
      }

      /* The heading, text and proceed link carry the hostname, which can be
         one unbroken string: let it break rather than run off the page. */
      .ssl-heading {
        margin: 6px 0 0;
        font-size: 22px;
        line-height: 28px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--n-text-1);
        overflow-wrap: anywhere;
      }

      .ssl-text {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 20px;
        color: var(--n-text-2);
        overflow-wrap: anywhere;
      }

      .ssl-text .host {
        font-weight: 600;
        color: var(--n-text-1);
      }

      .ssl-code {
        align-self: flex-start;
        margin-top: 14px;
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--n-text-2);
        background: var(--n-fill);
        border-radius: var(--n-r-control);
        overflow-wrap: anywhere;
      }

      .ssl-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      /* Mirrors global.css .btn / .btn-primary / .btn-secondary. */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 14px;
        height: 32px;
        border-radius: var(--n-r-control);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        border: 0;
        flex: none;
        font-family: var(--font-sans);
        transition:
          background-color var(--dur-fast),
          box-shadow var(--dur-fast);
      }

      .btn.primary {
        background: var(--n-accent);
        color: var(--n-on-accent);
      }

      .btn.primary:hover {
        background: var(--n-accent-hover);
      }

      .btn.secondary {
        background: var(--n-fill);
        color: var(--n-text-1);
      }

      .btn.secondary:hover {
        background: var(--n-fill-2);
      }

      .btn svg {
        width: 14px;
        height: 14px;
        flex: none;
      }

      /* Keyboard focus only: a soft accent halo, never an outline. */
      :focus-visible {
        outline: none;
        box-shadow: var(--n-focus-ring);
      }

      /* Advanced toggle + risks panel. The toggle is inline-flex, so this
         rule's line height, not the button's own, sets its row's height. */
      .advanced {
        margin-top: 30px;
        padding-top: 18px;
        border-top: 1px solid var(--n-separator);
        line-height: 20px;
      }

      .advanced-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 16px;
        font-weight: 600;
        color: var(--n-text-1);
        background: transparent;
        border: 0;
        border-radius: var(--n-r-control);
        padding: 0;
        cursor: pointer;
      }

      .advanced-toggle .chev {
        width: 14px;
        height: 14px;
        flex: none;
        color: var(--n-text-3);
        transition: transform var(--dur-fast);
      }

      .advanced-toggle.open .chev {
        transform: rotate(90deg);
      }

      .advanced-body {
        display: none;
        margin: 14px 0 0 20px;
      }

      .advanced-body.open {
        display: block;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px 16px;
        background: var(--n-grouped);
        border-radius: var(--n-r-panel);
      }

      .panel-head .panel-title {
        font-size: 12px;
        line-height: 15px;
        font-weight: 600;
        color: var(--n-text-3);
      }

      .panel-head .panel-sub {
        font-size: 12px;
        line-height: 15px;
        color: var(--n-text-3);
        margin-top: 2px;
      }

      .risk-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .risk-list li {
        display: grid;
        grid-template-columns: 4px 1fr;
        gap: 10px;
        font-size: 13px;
        line-height: 19px;
        color: var(--n-text-2);
      }

      .risk-list li::before {
        content: '';
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--n-control-edge);
        margin-top: 8px;
      }

      .panel-foot {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-top: 4px;
      }

      /* Proceed link — plain red text link inside the Advanced panel so it's
         intentionally lower priority than the primary "Go back to safety"
         action above. */
      .proceed-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        font-size: 13px;
        line-height: 16px;
        font-weight: 500;
        color: var(--n-danger);
        background: transparent;
        border: 0;
        border-radius: var(--n-r-control);
        cursor: pointer;
        font-family: var(--font-sans);
        overflow-wrap: anywhere;
        text-align: left;
      }

      .ssl-url {
        margin-top: 4px;
        font-size: 12px;
        line-height: 16px;
        color: var(--n-text-3);
        overflow-wrap: anywhere;
      }

      @media (prefers-reduced-motion: reduce) {
        .btn,
        .advanced-toggle .chev {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ssl-wrapper">
      <div class="ssl-head">
        <h1 class="ssl-title">{{TITLE}}</h1>
      </div>

      <div class="ssl-main">
        <span class="ssl-glyph">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            {{ICON_SVG}}
          </svg>
        </span>
        <div class="ssl-eyebrow">{{EYEBROW}}</div>
        <h2 class="ssl-heading">{{HEADING}}</h2>
        <p class="ssl-text">{{MESSAGE}}</p>
        <span class="ssl-code">{{ERROR_CODE}}</span>

        <div class="ssl-actions">
          <button class="btn primary" id="goBackBtn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Go back to safety
          </button>
        </div>
      </div>

      <div class="advanced">
        <button class="advanced-toggle" id="advancedToggle" type="button">
          <svg
            class="chev"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
          Advanced
        </button>

        <div class="advanced-body" id="advancedBody">
          <div class="panel">
            <div class="panel-head">
              <div class="panel-title">Risks of proceeding</div>
              <div class="panel-sub">Read these before overriding the warning.</div>
            </div>
            <ul class="risk-list">
              {{RISK_DETAILS}}
            </ul>
            <div class="panel-foot">
              <button class="proceed-link" id="proceedBtn" data-url="{{ENCODED_URL}}">
                Proceed to {{HOSTNAME}} (unsafe)&nbsp;→
              </button>
              <div class="ssl-url">{{URL_DISPLAY}}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var toggle = document.getElementById('advancedToggle');
      var body = document.getElementById('advancedBody');
      toggle.addEventListener('click', function () {
        toggle.classList.toggle('open');
        body.classList.toggle('open');
      });

      document.getElementById('goBackBtn').addEventListener('click', function () {
        document.title = '__ssl_go_back__';
      });

      document.getElementById('proceedBtn').addEventListener('click', function () {
        var encoded = this.getAttribute('data-url');
        var url = atob(encoded);
        window.location.href = url;
      });
    </script>
  </body>
</html>
