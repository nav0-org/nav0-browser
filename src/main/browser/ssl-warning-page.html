<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      :root {
        --bg-0: #ffffff;
        --bg-panel: #f5f5f7;
        --bg-panel-strong: rgba(0, 0, 0, 0.05);
        --fg-1: #1d1d1f;
        --fg-2: #424245;
        --fg-3: #6e6e73;
        --fg-4: #6e6e73;
        --border-1: #e5e5ea;
        --border-2: #d1d1d6;
        --icon-well: #f2f2f4;
        --danger: #d70015;
        --danger-soft: rgba(215, 0, 21, 0.08);
        --accent: #0066d6;
        --accent-hover: #0058b9;
        --r-xs: 4px;
        --r-sm: 4px;
        --r-md: 6px;
        --r-lg: 8px;
        --dur-fast: 120ms;
        --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: var(--bg-0);
        color: var(--fg-1);
        font-family: var(--font-sans);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      .ssl-wrapper {
        max-width: 880px;
        margin: 0 auto;
        padding: 72px 24px 80px;
      }

      .ssl-head {
        margin-bottom: 28px;
      }

      .ssl-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--danger);
        margin: 0;
        line-height: 34px;
      }

      .ssl-main {
        display: flex;
        flex-direction: column;
      }

      .ssl-glyph {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--r-xs);
        background: var(--danger-soft);
        color: var(--danger);
      }

      .ssl-glyph svg {
        width: 24px;
        height: 24px;
        display: block;
      }

      .ssl-eyebrow {
        margin-top: 18px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--fg-3);
      }

      .ssl-heading {
        margin: 6px 0 0;
        font-size: 22px;
        line-height: 28px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--fg-1);
      }

      .ssl-text {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 20px;
        color: var(--fg-2);
        max-width: 620px;
      }

      .ssl-text .host {
        font-weight: 600;
        color: var(--fg-1);
      }

      .ssl-code {
        align-self: flex-start;
        margin-top: 14px;
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg-2);
        background: var(--bg-panel-strong);
        border-radius: var(--r-xs);
      }

      .ssl-actions {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
        height: 32px;
        border-radius: var(--r-xs);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        font-family: var(--font-sans);
        transition:
          background var(--dur-fast),
          border-color var(--dur-fast),
          color var(--dur-fast);
      }

      .btn.primary {
        background: var(--accent);
        color: #ffffff;
        border-color: var(--accent);
      }

      .btn.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .btn.secondary {
        background: transparent;
        color: var(--fg-1);
        border-color: var(--border-2);
      }

      .btn.secondary:hover {
        background: var(--bg-panel);
      }

      .btn svg {
        width: 14px;
        height: 14px;
      }

      /* Advanced toggle + risks panel */
      .advanced {
        margin-top: 30px;
        padding-top: 18px;
        border-top: 1px solid var(--border-1);
      }

      .advanced-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--fg-1);
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .advanced-toggle .chev {
        display: inline-block;
        transition: transform var(--dur-fast);
        font-size: 10px;
        color: var(--fg-3);
      }

      .advanced-toggle.open .chev {
        transform: rotate(90deg);
      }

      .advanced-body {
        display: none;
        margin: 14px 0 0 20px;
      }

      .advanced-body.open {
        display: block;
      }

      .panel {
        background: var(--bg-panel);
        border-radius: var(--r-md);
        overflow: hidden;
      }

      .panel-head {
        padding: 14px 16px 10px;
      }

      .panel-head .panel-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-3);
      }

      .panel-head .panel-sub {
        font-size: 12px;
        color: var(--fg-3);
        margin-top: 2px;
      }

      .risk-list {
        list-style: none;
        margin: 0;
        padding: 0 16px;
      }

      .risk-list li {
        display: grid;
        grid-template-columns: 4px 1fr;
        gap: 10px;
        padding: 3px 0;
        font-size: 13px;
        line-height: 19px;
        color: var(--fg-2);
      }

      .risk-list li::before {
        content: '';
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #8e8e93;
        margin-top: 8px;
      }

      .panel-foot {
        padding: 10px 16px 16px;
      }

      /* Proceed link — plain red text link inside the Advanced panel so it's
         intentionally lower priority than the primary "Go back to safety"
         action above. */
      .proceed-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--danger);
        background: transparent;
        border: 0;
        cursor: pointer;
        font-family: var(--font-sans);
      }

      .ssl-url {
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--fg-4);
        word-break: break-all;
      }

      @media (prefers-reduced-motion: reduce) {
        .btn,
        .advanced-toggle .chev {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ssl-wrapper">
      <div class="ssl-head">
        <h1 class="ssl-title">{{TITLE}}</h1>
      </div>

      <div class="ssl-main">
        <span class="ssl-glyph">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            {{ICON_SVG}}
          </svg>
        </span>
        <div class="ssl-eyebrow">{{EYEBROW}}</div>
        <h2 class="ssl-heading">{{HEADING}}</h2>
        <p class="ssl-text">{{MESSAGE}}</p>
        <span class="ssl-code">{{ERROR_CODE}}</span>

        <div class="ssl-actions">
          <button class="btn primary" id="goBackBtn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Go back to safety
          </button>
        </div>
      </div>

      <div class="advanced">
        <button class="advanced-toggle" id="advancedToggle" type="button">
          <span class="chev">▶</span> Advanced
        </button>

        <div class="advanced-body" id="advancedBody">
          <div class="panel">
            <div class="panel-head">
              <div class="panel-title">Risks of proceeding</div>
              <div class="panel-sub">Read these before overriding the warning.</div>
            </div>
            <ul class="risk-list">
              {{RISK_DETAILS}}
            </ul>
            <div class="panel-foot">
              <button class="proceed-link" id="proceedBtn" data-url="{{ENCODED_URL}}">
                Proceed to {{HOSTNAME}} (unsafe) →
              </button>
              <div class="ssl-url">{{URL_DISPLAY}}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var toggle = document.getElementById('advancedToggle');
      var body = document.getElementById('advancedBody');
      toggle.addEventListener('click', function () {
        toggle.classList.toggle('open');
        body.classList.toggle('open');
      });

      document.getElementById('goBackBtn').addEventListener('click', function () {
        document.title = '__ssl_go_back__';
      });

      document.getElementById('proceedBtn').addEventListener('click', function () {
        var encoded = this.getAttribute('data-url');
        var url = atob(encoded);
        window.location.href = url;
      });
    </script>
  </body>
</html>
