<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Downloads</title>
  </head>
  <body>
    <div id="downloads-page" class="list-page downloads-page">
      <div class="list-column">
        <h1 class="list-title">Downloads</h1>

        <!-- Toolbar: filled search + secondary Clear -->
        <div class="list-toolbar">
          <label class="search-field">
            <i data-lucide="search" width="16" height="16"></i>
            <input type="text" id="search-input" placeholder="Search downloads…" />
          </label>
          <button id="delete-all" class="btn btn-secondary" hidden>
            <i data-lucide="trash-2" width="14" height="14"></i> Clear All Downloads
          </button>
        </div>

        <!-- Type filter chips — dedicated row so Clear stays next to the search bar -->
        <div class="chip-row">
          <span class="chip-row-label">Categories</span>
          <div id="type-filters" class="chip-row-chips"></div>
        </div>

        <!-- Storage panel (grey) -->
        <div id="storage-gauge" class="panel storage-panel">
          <div class="panel-head">
            <div class="panel-title">Storage</div>
            <div class="panel-meta" id="storage-meta"></div>
          </div>
          <div id="storage-bar" class="storage-bar"></div>
          <div id="storage-legend" class="storage-legend"></div>
        </div>

        <!-- Downloads list (day-grouped, populated by TS) -->
        <div class="downloads-container">
          <div id="downloads-list" class="list-grid downloads-list"></div>
          <div id="no-downloads" class="list-empty" hidden>No downloads match your search.</div>
        </div>

        <!-- Footer placeholder (Clear moved to toolbar) -->
        <div class="downloads-footer" id="downloads-footer"></div>
      </div>
    </div>
  </body>
</html>
