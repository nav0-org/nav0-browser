<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Browsing History</title>
  </head>
  <body>
    <div class="list-page">
      <div class="list-column">
        <h1 class="list-title">History</h1>

        <!-- Toolbar: search + time-range + clear -->
        <div class="list-toolbar">
          <label class="search-field">
            <i data-lucide="search" width="16" height="16"></i>
            <input type="text" id="search-input" placeholder="Search history…" />
          </label>
          <div class="segmented" role="tablist">
            <button class="segmented-btn time-range-btn active" data-range="all">All</button>
            <button class="segmented-btn time-range-btn" data-range="week">Week</button>
            <button class="segmented-btn time-range-btn" data-range="today">Today</button>
          </div>
          <button id="delete-all" class="btn btn-secondary" hidden>
            <i data-lucide="trash-2" width="14" height="14"></i> Clear All History
          </button>
        </div>

        <!-- Heatmap -->
        <div class="panel panel-heat" id="heatmap-container"></div>

        <!-- Analytics Row -->
        <div class="analytics-grid">
          <div class="panel analytics-card">
            <div class="panel-head">
              <div class="panel-title" id="domain-chart-label">Top Sites</div>
            </div>
            <div class="stat-list" id="domain-chart-container"></div>
          </div>
          <div class="panel analytics-card">
            <div class="panel-head">
              <div class="panel-title" id="category-label">By Category</div>
            </div>
            <div class="stat-list" id="category-container"></div>
          </div>
        </div>

        <!-- Session-grouped history -->
        <div id="history-list" class="history-list"></div>

        <!-- Empty state -->
        <div id="no-history" class="list-empty" hidden>
          <i data-lucide="clock" width="32" height="32"></i>
          <p>No browsing history found</p>
        </div>

        <!-- Loading -->
        <div id="loading-indicator" class="loading-indicator" hidden>Loading…</div>

        <!-- Footer placeholder (Clear All moved into toolbar) -->
        <div class="history-footer" id="history-footer"></div>

        <!-- Infinite scroll sentinel -->
        <div id="scroll-sentinel" class="scroll-sentinel"></div>
      </div>
    </div>
  </body>
</html>
